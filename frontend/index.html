<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 11-REVIEW CR-01: frames may load only blob: documents (the PDF preview), so a PDF link
         can't navigate the iframe to a page that posts to Wails' frame-agnostic IPC handler.
         Frames and workers only: no default-src or script-src, so Wails' injected scripts are untouched. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src blob:; child-src blob:; worker-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Portty</title>
    <style>
      :root { color-scheme: light dark; }
      #splash-static {
        position: fixed;
        inset: 0;
        background: Canvas;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="splash-static"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
