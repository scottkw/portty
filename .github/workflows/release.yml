name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test -race -short ./...

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend tests
        run: cd frontend && pnpm install && pnpm test

  build-macos:
    needs: [validate]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      id-token: write          # attest-build-provenance OIDC signing
      attestations: write      # persist to GH attestations API
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI (version from go.mod)
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          [ -n "$WAILS_VER" ] || { echo "wails not pinned in go.mod"; exit 1; }
          go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VER"

      - name: Ensure frontend/dist exists for embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      # The bundle's CFBundle*Version comes from wails.json, so stamp it from
      # the same tag as main.Version. Plist versions must be numeric, so the
      # pre-release suffix is dropped (v1.2.0-beta.1 -> 1.2.0).
      - name: Stamp bundle version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          V="${V%%-*}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z[-suffix]"; exit 1; }
          jq --arg v "$V" '.info.productVersion = $v' wails.json > wails.json.tmp && mv wails.json.tmp wails.json

      - name: Build macOS app
        run: |
          wails build -platform darwin/universal -tags wailsassets \
            -ldflags "-X main.Version=${GITHUB_REF_NAME}"

      - name: Copy branded ICNS into bundle
        run: |
          cp build/darwin/iconfile.icns build/bin/Portty.app/Contents/Resources/iconfile.icns

      # CRITICAL: tar .app BEFORE upload — actions/upload-artifact zips and strips symlinks/+x bits
      # (90-RESEARCH.md Pitfall 1 lines 471-477)
      - name: Tar .app bundle (preserve symlinks and +x bits)
        run: tar -czf build/bin/Portty.app.tar.gz -C build/bin Portty.app

      - name: Attest unsigned artifact (internal)
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/bin/Portty.app.tar.gz

      - name: Stage attestation bundle alongside artifact
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" build/bin/attestation.json

      - name: Upload unsigned .app bundle + attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portty-darwin-universal-unsigned
          path: |
            build/bin/Portty.app.tar.gz
            build/bin/attestation.json
          if-no-files-found: error

  sign-macos:
    needs: [build-macos]
    runs-on: macos-latest
    timeout-minutes: 150 # two notarization waits (.app and DMG), each capped at 60m below
    environment: release
    permissions:
      contents: read
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Download unsigned .app bundle + attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portty-darwin-universal-unsigned
          path: artifacts/

      - name: Verify internal attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE=$(ls artifacts/attestation.json artifacts/*.sigstore.json 2>/dev/null | head -1 || true)
          if [[ -z "$BUNDLE" ]]; then
            echo "FAIL: no attestation bundle found in artifacts/"
            ls -la artifacts/
            exit 1
          fi
          echo "Verifying attestation bundle: $BUNDLE"
          gh attestation verify artifacts/Portty.app.tar.gz \
            --repo ${{ github.repository }} \
            --bundle "$BUNDLE"

      - name: Untar .app bundle
        run: |
          mkdir -p build/bin
          tar -xzf artifacts/Portty.app.tar.gz -C build/bin/

      # ======================================================================
      # Below: codesign/notarize/DMG steps came from the old build-macos job.
      # The DMG is now also notarized, stapled and checked the way the in-app
      # updater (internal/updater) checks it, before the keychain is deleted.
      # ======================================================================

      - name: Import certificate to keychain
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain

      - name: Sign .app with hardened runtime
        run: |
          codesign --deep --force --verbose \
            --options runtime \
            --timestamp \
            --entitlements build/entitlements.plist \
            --sign "$MACOS_CERTIFICATE_NAME" \
            build/bin/Portty.app

      - name: Notarize .app
        run: |
          xcrun notarytool store-credentials "portty-notarize" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --password "$MACOS_NOTARIZATION_PWD"
          ditto -c -k --keepParent build/bin/Portty.app build/bin/portty-notarize.zip
          xcrun notarytool submit build/bin/portty-notarize.zip \
            --keychain-profile "portty-notarize" \
            --wait --timeout 60m
          xcrun stapler staple build/bin/Portty.app

      - name: Create and sign DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DMG_NAME="portty-${VERSION}-darwin-universal.dmg"
          hdiutil create -volname "Portty" -srcfolder build/bin/Portty.app -ov -format UDZO "build/bin/${DMG_NAME}"
          # The in-app updater requires the DMG's signing identifier to be its asset name without
          # .dmg, which binds the file to this version (no rollback or cross-product swap).
          codesign --force --timestamp --identifier "portty-${VERSION}-darwin-universal" \
            --sign "$MACOS_CERTIFICATE_NAME" "build/bin/${DMG_NAME}"

      # Runs before "Cleanup keychain": the portty-notarize profile lives in build.keychain.
      - name: Notarize and staple DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DMG="build/bin/portty-${VERSION}-darwin-universal.dmg"
          xcrun notarytool submit "$DMG" --keychain-profile "portty-notarize" --wait --timeout 60m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # The in-app updater (internal/updater Verify) rejects any DMG that fails
      # these checks, so a release must never ship one. The Team ID is
      # hardcoded to match updater.TeamID; the identifier must be the asset name
      # without .dmg.
      - name: Verify DMG like the in-app updater
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DMG="build/bin/portty-${VERSION}-darwin-universal.dmg"
          codesign --verify --strict "$DMG"
          DVV=$(codesign -dvv "$DMG" 2>&1)
          echo "$DVV"
          grep -qx 'TeamIdentifier=S2K7P43927' <<< "$DVV" || { echo "FAIL: DMG is not signed by Team S2K7P43927"; exit 1; }
          grep -qx "Identifier=portty-${VERSION}-darwin-universal" <<< "$DVV" || { echo "FAIL: DMG identifier is not portty-${VERSION}-darwin-universal"; exit 1; }
          SPCTL=$(spctl -a -t open --context context:primary-signature -vv "$DMG" 2>&1) || { echo "$SPCTL"; echo "FAIL: spctl rejected the DMG"; exit 1; }
          echo "$SPCTL"
          grep -q ': accepted' <<< "$SPCTL" || { echo "FAIL: spctl did not accept the DMG"; exit 1; }
          grep -qx 'source=Notarized Developer ID' <<< "$SPCTL" || { echo "FAIL: the DMG is not notarized"; exit 1; }

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 build/bin/portty-notarize.zip

      - name: Upload signed DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: build/bin/portty-*.dmg
          if-no-files-found: error

  publish:
    needs: [build-macos, sign-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # create/update release
      id-token: write          # release attestation OIDC
      attestations: write      # persist release attestation to GH API
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          # Only the signed DMG ships. The explicit glob excludes attestation
          # .json bundles and the unsigned Portty.app.tar.gz intermediate.
          sha256sum *.dmg > checksums.txt
          cat checksums.txt

      - name: Release build-provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: artifacts/checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            artifacts/*.dmg
            artifacts/checksums.txt
          fail_on_unmatched_files: true
          draft: ${{ contains(github.ref_name, '-rc') }}
          # Any pre-release suffix (-rc, -beta, -alpha, ...) is flagged so the
          # in-app updater, which skips prereleases, never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Publishes with the job's GITHUB_TOKEN (contents: write). No workflow
          # triggers on `release` any more (DIST-03), so the old
          # RELEASE_PUBLISH_TOKEN PAT is unused and can be deleted from the
          # repo secrets.
