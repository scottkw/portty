name: Release

on:
  push:
    tags:
      - 'v*'

# These are published asset names every installed copy looks for. v1.2.x updaters know only the
# universal one; builds from Phase 18 on try universal first, then arm64. Both are the same
# arm64-only build. Keep in step with updater.DMGAssetNames (pinned by release_workflow_test.go);
# drop the universal name only in a later release, once both Macs run a Phase 18 or later build.
env:
  DMG_SUFFIXES: "darwin-universal darwin-arm64"

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # build.yml runs this too, but a v* tag can point at a commit that never passed it.
      - name: Brand gate (BRND-05, BRND-06, DIST-03, VM-only build tag)
        run: bash tests/check-brand.sh

      # A v* tag may point at a commit build.yml never checked; the gates are only trustworthy if
      # their fixture tests pass.
      - name: Run bundle gate tests (REL-01)
        run: bash tests/verify-bundle.test.sh

      # TestNoFakeWhoIsInRelease lists the wailsassets build, whose embed pattern
      # needs frontend/dist to exist.
      - name: Ensure frontend/dist exists for embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Run Go tests
        run: go test -race -short ./...

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend tests
        run: cd frontend && pnpm install && pnpm test

  build-macos:
    needs: [validate]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      id-token: write          # attest-build-provenance OIDC signing
      attestations: write      # persist to GH attestations API
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI (version from go.mod)
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          [ -n "$WAILS_VER" ] || { echo "wails not pinned in go.mod"; exit 1; }
          go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VER"

      - name: Ensure frontend/dist exists for embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      # The bundle's CFBundle*Version comes from wails.json, so stamp it from
      # the same tag as main.Version. Plist versions must be numeric, so the
      # pre-release suffix is dropped (v1.2.0-beta.1 -> 1.2.0).
      - name: Stamp bundle version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          V="${V%%-*}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z[-suffix]"; exit 1; }
          jq --arg v "$V" '.info.productVersion = $v' wails.json > wails.json.tmp && mv wails.json.tmp wails.json

      # Wails otherwise forces a 10.13 deployment target (23-RESEARCH Pattern 9); Portty needs 14.0.
      - name: Build macOS app
        env:
          CGO_CFLAGS: "-mmacosx-version-min=14.0"
          CGO_LDFLAGS: "-mmacosx-version-min=14.0"
        run: |
          wails build -platform darwin/arm64 -tags wailsassets \
            -ldflags "-X main.Version=${GITHUB_REF_NAME}"

      # The VM-only fake update feed (cmd/fakegh's address) must never reach a release binary.
      - name: Release binary carries no VM-only fakes
        run: |
          BIN=build/bin/Portty.app/Contents/MacOS/Portty
          test -f "$BIN" || { echo "FAIL: $BIN not built"; exit 1; }
          N=$(grep -ac '127.0.0.1:8788' "$BIN" || true)
          [ "$N" = 0 ] || { echo "FAIL: the release binary contains the VM-only fake update feed address"; exit 1; }

      - name: Copy branded ICNS into bundle
        run: |
          cp build/darwin/iconfile.icns build/bin/Portty.app/Contents/Resources/iconfile.icns

      - name: Release bundle is arm64-only with minos 14.0 (REL-01)
        run: bash scripts/verify-bundle.sh build/bin/Portty.app

      # CRITICAL: tar .app BEFORE upload — actions/upload-artifact zips and strips symlinks/+x bits
      # (90-RESEARCH.md Pitfall 1 lines 471-477)
      - name: Tar .app bundle (preserve symlinks and +x bits)
        run: tar -czf build/bin/Portty.app.tar.gz -C build/bin Portty.app

      - name: Attest unsigned artifact (internal)
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/bin/Portty.app.tar.gz

      - name: Stage attestation bundle alongside artifact
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" build/bin/attestation.json

      - name: Upload unsigned .app bundle + attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portty-darwin-arm64-unsigned
          path: |
            build/bin/Portty.app.tar.gz
            build/bin/attestation.json
          if-no-files-found: error

  sign-macos:
    needs: [build-macos]
    runs-on: macos-latest
    timeout-minutes: 210 # three notarization waits (.app and two DMGs), each capped at 60m below
    environment: release
    permissions:
      contents: read
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Download unsigned .app bundle + attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portty-darwin-arm64-unsigned
          path: artifacts/

      - name: Verify internal attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE=$(ls artifacts/attestation.json artifacts/*.sigstore.json 2>/dev/null | head -1 || true)
          if [[ -z "$BUNDLE" ]]; then
            echo "FAIL: no attestation bundle found in artifacts/"
            ls -la artifacts/
            exit 1
          fi
          echo "Verifying attestation bundle: $BUNDLE"
          gh attestation verify artifacts/Portty.app.tar.gz \
            --repo ${{ github.repository }} \
            --bundle "$BUNDLE"

      - name: Untar .app bundle
        run: |
          mkdir -p build/bin
          tar -xzf artifacts/Portty.app.tar.gz -C build/bin/

      # ======================================================================
      # Below: codesign/notarize/DMG steps came from the old build-macos job.
      # The DMG is now also notarized, stapled and checked the way the in-app
      # updater (internal/updater) checks it, before the keychain is deleted.
      # ======================================================================

      - name: Import certificate to keychain
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain

      # Signs inside out, one codesign per Mach-O, identifier app.portty.Portty. The gate fails on the
      # wrong team, a missing runtime flag, no timestamp, changed entitlements, a non-arm64 slice, a
      # minos below 14.0 or a designated requirement other than v1.2's (the office Mac's grants
      # depend on it).
      - name: Sign .app with hardened runtime
        run: |
          SIGN_IDENTITY="$MACOS_CERTIFICATE_NAME" bash scripts/sign-bundle.sh build/bin/Portty.app
          bash scripts/verify-bundle.sh build/bin/Portty.app --signed

      - name: Notarize .app
        run: |
          xcrun notarytool store-credentials "portty-notarize" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --password "$MACOS_NOTARIZATION_PWD"
          ditto -c -k --keepParent build/bin/Portty.app build/bin/portty-notarize.zip
          xcrun notarytool submit build/bin/portty-notarize.zip \
            --keychain-profile "portty-notarize" \
            --wait --timeout 60m
          xcrun stapler staple build/bin/Portty.app
          bash scripts/verify-bundle.sh build/bin/Portty.app --notarized

      - name: Create and sign DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Create the image once under the first name and copy it, so no intermediate file
          # matches portty-*.dmg. Signing comes after the copy: each name gets its own identifier.
          FIRST=""
          for SUFFIX in $DMG_SUFFIXES; do
            NAME="portty-${VERSION}-${SUFFIX}"
            DMG="build/bin/${NAME}.dmg"
            if [ -z "$FIRST" ]; then
              hdiutil create -volname "Portty" -srcfolder build/bin/Portty.app -ov -format UDZO "$DMG"
              FIRST="$DMG"
            else
              cp "$FIRST" "$DMG"
            fi
          done
          # The in-app updater requires the DMG's signing identifier to be its asset name without
          # .dmg, which binds the file to this version (no rollback or cross-product swap).
          for SUFFIX in $DMG_SUFFIXES; do
            NAME="portty-${VERSION}-${SUFFIX}"
            DMG="build/bin/${NAME}.dmg"
            codesign --force --timestamp --identifier "${NAME}" \
              --sign "$MACOS_CERTIFICATE_NAME" "$DMG"
          done

      # Runs before "Cleanup keychain": the portty-notarize profile lives in build.keychain.
      - name: Notarize and staple DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for SUFFIX in $DMG_SUFFIXES; do
            NAME="portty-${VERSION}-${SUFFIX}"
            DMG="build/bin/${NAME}.dmg"
            xcrun notarytool submit "$DMG" --keychain-profile "portty-notarize" --wait --timeout 60m
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          done

      # The in-app updater (internal/updater Verify) rejects any DMG that fails
      # these checks, so a release must never ship one. The Team ID is
      # hardcoded to match updater.TeamID; the identifier must be the asset name
      # without .dmg.
      - name: Verify DMG like the in-app updater
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for SUFFIX in $DMG_SUFFIXES; do
            NAME="portty-${VERSION}-${SUFFIX}"
            DMG="build/bin/${NAME}.dmg"
            codesign --verify --strict "$DMG"
            DVV=$(codesign -dvv "$DMG" 2>&1)
            echo "$DVV"
            grep -qx 'TeamIdentifier=S2K7P43927' <<< "$DVV" || { echo "FAIL: $DMG is not signed by Team S2K7P43927"; exit 1; }
            grep -qx "Identifier=${NAME}" <<< "$DVV" || { echo "FAIL: $DMG identifier is not ${NAME}"; exit 1; }
            SPCTL=$(spctl -a -t open --context context:primary-signature -vv "$DMG" 2>&1) || { echo "$SPCTL"; echo "FAIL: spctl rejected $DMG"; exit 1; }
            echo "$SPCTL"
            grep -q ': accepted' <<< "$SPCTL" || { echo "FAIL: spctl did not accept $DMG"; exit 1; }
            grep -qx 'source=Notarized Developer ID' <<< "$SPCTL" || { echo "FAIL: $DMG is not notarized"; exit 1; }
          done

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 build/bin/portty-notarize.zip

      - name: Upload signed DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: build/bin/portty-*.dmg
          if-no-files-found: error

  publish:
    needs: [build-macos, sign-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # create/update release
      id-token: write          # release attestation OIDC
      attestations: write      # persist release attestation to GH API
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          # Only the signed DMG ships. The explicit glob excludes attestation
          # .json bundles and the unsigned Portty.app.tar.gz intermediate.
          sha256sum *.dmg > checksums.txt
          cat checksums.txt
          # Exactly the published names, nothing else (no stray image or zip).
          [ "$(wc -l < checksums.txt | tr -d ' ')" = "$(set -- $DMG_SUFFIXES; echo $#)" ] || { echo "FAIL: checksums.txt does not hold exactly one line per DMG"; exit 1; }
          for SUFFIX in $DMG_SUFFIXES; do
            grep -q "portty-${GITHUB_REF_NAME}-${SUFFIX}.dmg\$" checksums.txt || { echo "FAIL: checksums.txt lacks portty-${GITHUB_REF_NAME}-${SUFFIX}.dmg"; exit 1; }
          done

      - name: Release build-provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: artifacts/checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          body: |
            Apple Silicon and macOS 14 or later only.
            This release needs macOS 14 or later on an Apple Silicon Mac.
          files: |
            artifacts/*.dmg
            artifacts/checksums.txt
          fail_on_unmatched_files: true
          draft: ${{ contains(github.ref_name, '-rc') }}
          # Any pre-release suffix (-rc, -beta, -alpha, ...) is flagged so the
          # in-app updater, which skips prereleases, never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Publishes with the job's GITHUB_TOKEN (contents: write). No workflow
          # triggers on `release` any more (DIST-03), so the old
          # RELEASE_PUBLISH_TOKEN PAT is unused and can be deleted from the
          # repo secrets.
