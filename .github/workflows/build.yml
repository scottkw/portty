name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Single entry kept as a matrix so the required check context name
        # "build (agenthub, darwin/universal, macos-latest)" stays stable.
        build:
          - name: agenthub
            platform: darwin/universal
            os: macos-latest

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run Go tests (race detector)
        shell: bash
        run: go test -race -short ./...

      - name: Run build script tests
        run: bash tests/build-script.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend tests
        run: cd frontend && pnpm install && pnpm test

      - name: Verify traceability paths exist
        run: bash tests/check-traceability-paths.sh

      - name: Install Wails CLI (version from go.mod)
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          [ -n "$WAILS_VER" ] || { echo "wails not pinned in go.mod"; exit 1; }
          go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VER"

      - name: Ensure frontend/dist exists for embed
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Build with Wails
        shell: bash
        run: wails build -platform ${{ matrix.build.platform }} -tags wailsassets

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenthub-darwin-universal
          path: build/bin/agenthub.app
          if-no-files-found: error
