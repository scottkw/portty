name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Single entry kept as a matrix so the required check context name
        # "build (portty, darwin/arm64, macos-latest)" stays stable (TESTING.md Section 3).
        build:
          - name: portty
            platform: darwin/arm64
            os: macos-latest

    runs-on: ${{ matrix.build.os }}
    timeout-minutes: 30 # a hung PTY test must not hold a macOS runner for 6 h

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Brand gate (BRND-05, BRND-06, DIST-03)
        run: bash tests/check-brand.sh

      - name: Share removal gate (SHAR-02, SHAR-05)
        run: bash tests/check-share-removal.sh

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Before go test: TestNoFakeWhoIsInRelease lists the wailsassets build, whose
      # embed pattern needs frontend/dist to exist.
      - name: Ensure frontend/dist exists for embed
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Run Go tests (race detector)
        shell: bash
        run: go test -race -short ./...

      - name: Run build script tests
        run: bash tests/build-script.test.sh

      - name: Run bundle gate tests (REL-01)
        run: bash tests/verify-bundle.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend tests
        run: cd frontend && pnpm install && pnpm test

      - name: Verify traceability paths exist
        run: bash tests/check-traceability-paths.sh

      - name: Verify brand assets (BRND-02)
        run: bash scripts/verify-icons.sh

      - name: Install Wails CLI (version from go.mod)
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          [ -n "$WAILS_VER" ] || { echo "wails not pinned in go.mod"; exit 1; }
          go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VER"

      - name: Build with Wails
        shell: bash
        env:
          CGO_CFLAGS: "-mmacosx-version-min=14.0"
          CGO_LDFLAGS: "-mmacosx-version-min=14.0"
        run: wails build -platform ${{ matrix.build.platform }} -tags wailsassets

      - name: Bundle is arm64-only with minos 14.0 (REL-01)
        run: bash scripts/verify-bundle.sh build/bin/Portty.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portty-darwin-arm64
          path: build/bin/Portty.app
          if-no-files-found: error
